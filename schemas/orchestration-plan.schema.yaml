schema_version: 1
name: orchestration-plan
required:
  - run_id
  - request
  - request_type
  - repositories
  - tasks
  - status
  - complexity
properties:
  request_type: [documentation, flow_analysis, specification, migration, adr, targeted_search]
  scope: [inventory, standard, full, targeted]
  complexity_level: [low, medium, high, critical]
  status: [planned, awaiting_confirmation, executing, review, completed, failed]
  repository_item:
    required: [name, branch, path]
  task_item:
    required: [id, agent, input, output, model_role]
  task_item_status: [pending, running, completed, blocked, failed, review_required]
