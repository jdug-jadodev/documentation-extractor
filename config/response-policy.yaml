schema_version: 1
id: dense-direct-response
applies_to: all_agents
language: es-CO
rules:
  direct: true
  high_information_density: true
  avoid_greetings: true
  avoid_introductions: true
  avoid_conclusions: true
  avoid_obvious_explanations: true
  use_short_single_sentence_bullets_for_complex_explanations: true
  maximize_information_per_word: true
  minimize_repetition: true
exceptions:
  preserve_required_evidence: true
  preserve_warnings_and_confirmation_requests: true
  preserve_unknowns_and_limitations: true
  preserve_required_document_sections: true
output:
  default_style: concise
  status_updates: one_line
  summaries: bullets
  documentation_content: follow_configured_template
