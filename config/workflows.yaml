schema_version: 1
orchestrator: orchestrator

request_types:
  documentation:
    description: Generar o actualizar documentación de uno o varios repositorios.
    agents: [inventory, extraction, documentation, review, publication]
  flow_analysis:
    description: Analizar un flujo que cruza servicios, APIs, datos o mensajes.
    agents: [inventory, extraction, integration, review]
  specification:
    description: Proponer una especificación técnica para una nueva funcionalidad.
    agents: [inventory, extraction, integration, documentation, review, proposal]
  migration:
    description: Analizar una funcionalidad y proponer una estrategia de migración.
    agents: [inventory, extraction, integration, review, documentation, proposal]
  adr:
    description: Proponer una decisión arquitectónica con alternativas y consecuencias.
    agents: [inventory, extraction, integration, review, documentation, proposal]
  targeted_search:
    description: Buscar una API, mensaje, tabla, componente o relación concreta.
    agents: [inventory, extraction, integration]

routing:
  repository_scope:
    one_repository: repository_local
    multiple_repositories: cross_repository
    all_enabled_repositories: workspace
  default_scope: standard
  full_scope_requires_confirmation: true
  strong_reasoning_requires_confirmation: true
  publication_requires_human_review: true
  reuse_existing_inventory: true
  never_send_full_repository: true

outputs:
  plan: results/runs/<run-id>/orchestration-plan.yaml
  task_directory: results/runs/<run-id>/tasks/
  final_review: results/runs/<run-id>/final-review.yaml

documentation:
  default_format: ASD-TSE-100
  default_language: es-CO
  configuration: config/documentation.yaml
  template: templates/asd-tse-100-es.md
