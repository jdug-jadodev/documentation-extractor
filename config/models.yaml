schema_version: 1
# Edita solo este archivo para adaptar la instancia a los modelos disponibles.
# Los nombres son los identificadores que reconoce tu proveedor o tu herramienta de IA.

available_models:
  - id: codex-5.3
    provider: user_available
    strengths:
      - code_analysis
      - repository_analysis
    cost_class: economical
    enabled: true

  - id: luna-5.6
    provider: user_available
    strengths:
      - documentation
      - summarization
    cost_class: economical
    enabled: true

  - id: grok-4.5
    provider: user_available
    strengths:
      - complex_reasoning
      - cross_repository_analysis
      - contradiction_resolution
    cost_class: strong
    enabled: true

assignments:
  orchestrator: user_selected
  inventory: copilot_tools
  economical_code: codex-5.3
  economical_writing: luna-5.6
  proposal: luna-5.6
  strong_reasoning: grok-4.5

routing:
  strong_reasoning_only_when:
    - contradictions_between_findings
    - cross_repository_relation
    - low_confidence_high_impact_finding
    - unclear_business_rule
    - explicit_user_request
  never_send_full_repository: true
  require_confirmation_before_strong_model: true

budget:
  remaining_credits: 1800
  reserve: 300
  usable_limit: 1500
  strong_model_max_credits: 700
