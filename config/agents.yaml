schema_version: 1
models:
  inventory: local
  extraction: economical_code
  documentation: economical_writing
  integration: strong_reasoning
  review: strong_reasoning
  proposal: economical_writing
  publication: local

model_config: config/models.yaml
response_policy: config/response-policy.yaml
complexity_config: config/complexity.yaml
archify_config: config/archify.yaml

agents:
  - id: orchestrator
    enabled: true
    model_role: user_selected
    instruction: agents/orchestrator.md
    input: natural_language_request
    output: results/runs/<run-id>/orchestration-plan.yaml
  - id: inventory
    enabled: true
    execution: copilot_native
    model_role: copilot_tools
    instruction: agents/inventory.md
    input: workspace_repository_root
    output: results/runs/<run-id>/<repository>/inventory.yaml
  - id: extraction
    enabled: true
    execution: orchestrated
    model_role: economical_code
    budget_credits: 500
    instruction: agents/extraction.md
    input: inventory
    output: results/runs/<run-id>/<repository>/findings.yaml
  - id: documentation
    enabled: true
    execution: orchestrated
    model_role: economical_writing
    budget_credits: 300
    instruction: agents/documentation.md
    input: findings_relations_review_and_archify_contract
    output: results/runs/<run-id>/<repository>/documents.yaml
  - id: integration
    enabled: true
    execution: orchestrated
    model_role: strong_reasoning
    budget_credits: 400
    instruction: agents/integration.md
    input: documents_and_findings
    output: results/runs/<run-id>/relations.yaml
  - id: review
    enabled: true
    execution: orchestrated
    model_role: strong_reasoning
    budget_credits: 300
    instruction: agents/review.md
    input: uncertain_findings
    output: results/runs/<run-id>/<repository>/review.yaml
  - id: proposal
    enabled: true
    execution: orchestrated
    model_role: proposal
    budget_credits: 300
    instruction: agents/proposal.md
    input: reviewed_documents_findings_and_relations
    output: results/runs/<run-id>/proposal.yaml
  - id: publication
    enabled: false
    instruction: agents/publication.md
    input: validated_results
    output: catalog.yaml

extensions:
  skills:
    enabled: true
    directories:
      - .github/skills
  mcp:
    enabled: false
    servers: []
